<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00FF88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cloud background -->
  <path d="M 25 70 Q 20 70 20 60 Q 20 45 32 45 Q 38 35 50 35 Q 62 35 68 45 Q 80 45 85 55 Q 95 55 95 65 Q 95 75 85 75 L 25 75 Q 15 75 15 65 Q 15 70 25 70 Z" fill="url(#cloudGrad)" opacity="0.9"/>
  
  <!-- Heartbeat line -->
  <polyline points="15,60 25,60 30,48 35,60 40,60 45,50 50,65 55,40 60,60 65,60 75,60" 
            stroke="url(#pulseGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Heart pulse points -->
  <circle cx="30" cy="48" r="2" fill="#00FF88" opacity="0.8"/>
  <circle cx="50" cy="65" r="2" fill="#00FF88" opacity="0.8"/>
  <circle cx="55" cy="40" r="2" fill="#00FF88" opacity="0.8"/>
  
  <!-- Glow effect -->
  <circle cx="64" cy="60" r="35" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.3"/>
  <circle cx="64" cy="60" r="32" fill="none" stroke="#00FF88" stroke-width="0.5" opacity="0.2"/>
</svg>
