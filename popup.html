<!DOCTYPE html>
<html>
<head>
  <title>Render Keep Alive</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 420px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      padding: 0;
      margin: 0;
    }

    .container {
      background: white;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f0f0f0;
    }

    .logo {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .header-title h1 {
      font-size: 22px;
      font-weight: 700;
      color: #2c3e50;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 11px;
      color: #7f8c8d;
      margin-top: 2px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #2c3e50;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
      background: #f8f9fa;
      color: #2c3e50;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input[type="text"]::placeholder,
    input[type="number"]::placeholder {
      color: #bdc3c7;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    #status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      animation: slideIn 0.3s ease;
      font-weight: 500;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    #status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    #lastPingInfo {
      margin-top: 16px;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      border: 2px solid rgba(102, 126, 234, 0.2);
      border-radius: 8px;
      font-size: 13px;
      display: none;
      animation: slideIn 0.3s ease;
    }

    #lastPingInfo.show {
      display: block;
    }

    .ping-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-indicator.success {
      background-color: #27ae60;
    }

    .status-indicator.error {
      background-color: #e74c3c;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .ping-label {
      font-weight: 600;
      color: #2c3e50;
    }

    .ping-status-text {
      color: #7f8c8d;
    }

    .ping-time {
      color: #95a5a6;
      font-size: 12px;
      margin-top: 6px;
    }

    .info-text {
      margin-top: 16px;
      padding: 10px 12px;
      background-color: #ecf0f1;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      font-size: 12px;
      color: #555;
      line-height: 1.5;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      background: #667eea;
      color: white;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <svg class="logo" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#00FF88;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
        </linearGradient>
      </defs>
      <path d="M 25 70 Q 20 70 20 60 Q 20 45 32 45 Q 38 35 50 35 Q 62 35 68 45 Q 80 45 85 55 Q 95 55 95 65 Q 95 75 85 75 L 25 75 Q 15 75 15 65 Q 15 70 25 70 Z" fill="url(#cloudGrad)" opacity="0.9"/>
      <polyline points="15,60 25,60 30,48 35,60 40,60 45,50 50,65 55,40 60,60 65,60 75,60" stroke="url(#pulseGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="48" r="2" fill="#00FF88" opacity="0.8"/>
      <circle cx="50" cy="65" r="2" fill="#00FF88" opacity="0.8"/>
      <circle cx="55" cy="40" r="2" fill="#00FF88" opacity="0.8"/>
      <circle cx="64" cy="60" r="35" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.3"/>
      <circle cx="64" cy="60" r="32" fill="none" stroke="#00FF88" stroke-width="0.5" opacity="0.2"/>
    </svg>
    <div class="header-title">
      <h1>Keep Alive</h1>
      <p>Render Backend Monitor</p>
    </div>
  </div>

  <div class="form-group">
    <label for="url">🌐 Render URL</label>
    <input
      id="url"
      type="text"
      placeholder="https://your-app.onrender.com/health"
    />
  </div>

  <div class="form-group">
    <label for="interval">⏱️ Ping Interval (minutes)</label>
    <input
      id="interval"
      type="number"
      min="1"
      max="1440"
      value="5"
    />
  </div>

  <div class="button-group">
    <button id="saveBtn">💾 Save Settings</button>
  </div>

  <div id="status"></div>
  <div id="lastPingInfo"></div>

  <div class="info-text">
    <strong>💡 Tip:</strong> Once saved, the extension will automatically ping your server in the background to keep it awake.
  </div>
</div>

<script src="popup.js"></script>

</body>
</html>
